<aside
  class="orc-sidebar"
  [class.orc-sidebar--expanded]="isExpanded()"
  [class.orc-sidebar--collapsed]="isCollapsed()"
  [class.orc-sidebar--responsive]="state() === 'responsive'"
  [attr.aria-expanded]="isExpanded()"
>
  <!-- Cabecalho (ex: Logo, Avatar, Search) -->
  <div class="orc-sidebar__header">
    <ng-content select="[sidebar-header]"></ng-content>
  </div>

  <!-- Navegacao Principal -->
  <nav
    class="orc-sidebar__nav"
    [attr.aria-label]="ariaLabel()"
    role="navigation"
  >
    <ul class="orc-sidebar__nav-list">
      <ng-content></ng-content>
    </ul>
  </nav>

  <!-- Rodape (ex: Toggle, Settings, Logout) -->
  <div class="orc-sidebar__footer">
    <ng-content select="[sidebar-footer]"></ng-content>
    
    <!-- Botao embutido para collapse se o usuario desejar -->
    <div class="orc-sidebar__toggle-wrapper">
      <app-icon-button
        [icon]="isCollapsed() ? chevronRightIcon : chevronLeftIcon"
        variant="ghost"
        size="md"
        [ariaLabel]="isCollapsed() ? 'Expandir menu' : 'Recolher menu'"
        (click)="toggleState()"
      ></app-icon-button>
    </div>
  </div>
</aside>
