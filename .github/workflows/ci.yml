name: CI

on:
  push:
    branches: [main, v19, v20, v21, v22]
  pull_request:
    branches: [main, v19, v20, v21, v22]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chrome for tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Configure Chrome binary
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Verify Angular compatibility line
        run: npm run verify:compatibility

      - name: Run library tests
        run: |
          set -o pipefail
          if ! npm run test:lib:ci 2>&1 | tee test-output.log; then
            details=$(tail -n 25 test-output.log | tr '\n' ' ')
            echo "::error title=Library tests::${details:0:6000}"
            exit 1
          fi
        shell: bash

      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: v19-test-output
          path: test-output.log

      - name: Build library (@ciag/orchestra)
        run: npm run build:lib

      - name: Build documentation app
        run: npm run build:docs

      - name: Validate package distribution
        run: npm pack ./dist/orc-ds --dry-run
