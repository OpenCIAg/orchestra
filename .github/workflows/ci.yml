name: CI

on:
  push:
    branches: [main, v19, v20, v21, v22]
  pull_request:
    branches: [main, v19, v20, v21, v22]

jobs:
  validate:
    name: Test, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check library formatting
        run: npm run format:check

      - name: Verify Angular compatibility line
        run: npm run verify:compatibility

      - name: Verify component inventory and documentation links
        run: npm run verify:docs

      - name: Verify generated alias parity spec
        run: npm run verify:alias-parity

      - name: Run library tests
        run: |
          set -o pipefail
          if ! npm run test:lib:ci 2>&1 | tee test-output.log; then
            details=$(tail -n 25 test-output.log | tr '\n' ' ')
            echo "::error title=Library tests::${details:0:6000}"
            exit 1
          fi
        shell: bash

      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-test-output
          path: test-output.log

      - name: Build library (@ciag/orchestra)
        run: npm run build:lib

      - name: Verify light and dark browser themes
        run: npm run test:themes:ci

      - name: Build documentation app
        run: npm run build:docs

      - name: Test documentation app
        run: npm run test:docs -- --browsers=ChromeHeadlessCI

      - name: Install cross-browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test critical overlay interactions in Chromium, Firefox and WebKit
        run: npm run test:browser:interactions

      - name: Build application template
        run: npm run build:template

      - name: Validate package distribution
        run: |
          npm run verify:package
          npm run verify:package:minimum

      - name: Verify server-side rendering
        run: npm run verify:ssr

      - name: Upload SSR verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-ssr-verification
          path: verify-output/
