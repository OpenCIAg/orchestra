name: Release

on:
  push:
    branches:
      - main
      - v19
      - v20
      - v21
      - v22

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm trusted publishing client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chrome for tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Configure Chrome binary
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Verify Angular compatibility line
        run: npm run verify:compatibility

      - name: Run tests
        run: npm run test:lib:ci

      - name: Build library
        run: npm run build:lib

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          baseBranch: ${{ github.ref_name }}
          publish: npm publish ./dist/orc-ds --access public --tag $NPM_TAG
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'v19' && 'angular19' || github.ref_name == 'v20' && 'angular20' || github.ref_name == 'v21' && 'angular21' || 'angular22' }}
