name: Release

# Release contract (ticket #6 — governed publishing, single-owner streams).
#
# Triggers:
# - main pushes run the guards. The job publishes ONLY when the push carries a
#   governed release commit — the Version-PR merge produced by the changesets
#   flow (ticket #7): projects/orc-ds/package.json version differs from the
#   previous commit AND every .changeset/*.md proposal is consumed. Any other
#   main push exits the job successfully without publishing.
# - tag pushes (v*) publish the old lines. The tag routes through the tagGlob
#   declared per branch in compatibility/versions.json: v19.*/v20.*/v21.*
#   publish under angular19–angular21; v22.* is the frozen Angular-22 backport
#   line and accepts patch releases only (publish: patch-tag). A tag no branch
#   claims, or a tag that disagrees with the package version, fails the run.
# - Plain pushes to v19–v22 are not a trigger here; ci.yml validates them.
#
# Guard order on every publish path (tools/release/publish-guard.mjs, unit
# tests under tools/release/*.test.mjs): version changed vs the previous
# commit → trigger governed → version not already on the registry (collision)
# → only then build and publish. The guard exports ORCHESTRA_PUBLISH and
# ORCHESTRA_DIST_TAG; the publish step is skipped unless both say so.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Serialize releases per ref instead of racing them: a queued older run cannot
# interleave a publish (and a stale duplicate would fail the collision guard).
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Guarded release to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The guard compares HEAD~1 and reads the other release branches'
          # versions for the dist-tag reconciliation plan.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm trusted publishing client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Angular compatibility line and publishing topology
        run: npm run verify:compatibility

      - name: Guard the release trigger and registry state
        run: node tools/release/publish-guard.mjs

      - name: Build library
        run: npm run build:lib

      - name: Validate package distribution
        run: |
          npm run verify:package
          npm run verify:package:minimum

      - name: Publish package
        if: env.ORCHESTRA_PUBLISH == 'publish'
        run: npm publish ./dist/orc-ds --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ env.ORCHESTRA_DIST_TAG }}
