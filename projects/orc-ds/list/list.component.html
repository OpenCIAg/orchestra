<div class="orc-list" role="listbox" [attr.aria-label]="label() || null" [attr.aria-multiselectable]="selection()==='multiple' ? 'true' : null">@for(item of items();track item.id){<button type="button" class="orc-list__item" role="option" [disabled]="item.disabled" [attr.aria-selected]="selection()!=='none' ? item.selected : null" (click)="select(item)"><span class="orc-list__label">{{item.label}}</span>@if(item.description){<span class="orc-list__description">{{item.description}}</span>}</button>}@empty{@if(emptyMessage()){<div class="orc-list__empty">{{emptyMessage()}}</div>}}</div>
