<label
  class="orc-p2-date-input"
  [class]="styleClass()"
  [style]="style()"
  [class.orc-p2-date-input--fluid]="fluid()"
>
  @if (label()) {
    <span [id]="effectiveId() + '-label'"
      >{{ label() }}
      @if (required()) {
        <sup>*</sup>
      }
    </span>
  }
  <input
    class="orc-p2-date-input__native"
    [id]="effectiveId()"
    [name]="name()"
    type="date"
    [value]="value()"
    [min]="min() || null"
    [max]="max() || null"
    [required]="required()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [autofocus]="autofocus()"
    [attr.tabindex]="tabindex()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="
      ariaLabelledBy() || (label() ? effectiveId() + '-label' : null)
    "
    [attr.aria-describedby]="helperText() ? effectiveId() + '-helper' : null"
    [attr.aria-invalid]="!!error()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  @if (error()) {
    <small class="error" role="alert">{{ error() }}</small>
  }
  @if (!error() && helperText()) {
    <small [id]="effectiveId() + '-helper'">{{ helperText() }}</small>
  }
</label>
