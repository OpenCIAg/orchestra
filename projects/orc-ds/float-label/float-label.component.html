<span
  class="p-floatlabel p-component orc-p2-float-label"
  [class]="
    'p-floatlabel p-component orc-p2-float-label variant-' +
    variant() +
    (focused() ? ' focused' : '') +
    (filled() ? ' filled' : '') +
    ' ' +
    styleClass()
  "
  (focusin)="focused.set(true)"
  (focusout)="focused.set(false)"
  (input)="onInput($event)"
  ><ng-content
/></span>
