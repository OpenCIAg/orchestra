<article
  class="card {{ styleClass() }}"
  [style]="style()"
  [class.card--clickable]="clickable()"
  [class.card--selected]="selected()"
  [class.card--dashboard]="variant() === 'dashboard'"
  [class.card--flush]="flush() || media()"
  [class.card--media]="media()"
  [class.card--clip]="clip() || media()"
  [style.padding]="padding() ?? null"
  [attr.aria-label]="ariaLabel() || header() || null"
  (click)="onCardClick($event)"
>
  @if (clickable()) {
    <button
      #primaryButton
      type="button"
      class="card__primary-action"
      [attr.aria-label]="ariaLabel() || header() || 'Card action'"
      [attr.aria-pressed]="clickable() ? (selected() ? 'true' : 'false') : null"
      (click)="onPrimaryClick($event)"
    ></button>
  }
  @if (header() || subheader()) {
    <div class="card__header">
      @if (header()) {
        <div class="card__title">{{ header() }}</div>
      }
      @if (subheader()) {
        <div class="card__subtitle">{{ subheader() }}</div>
      }
    </div>
  }
  <ng-content></ng-content>
</article>
