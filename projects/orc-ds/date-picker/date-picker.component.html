<label class="orc-date-picker"><span class="orc-date-picker__label">{{label()}} @if(required()){<span aria-hidden="true">*</span>}</span><span class="orc-date-picker__control"><input [id]="inputId()" [name]="name()" [type]="showTime() ? 'datetime-local' : 'date'" [value]="inputValue()" [min]="min() || (minDate() ? inputValue() : '')" [max]="max() || (maxDate() ? inputValue() : '')" [placeholder]="placeholder()" [required]="required()" [disabled]="disabled() || cvaDisabled()" [readonly]="readonlyInput()" [autofocus]="autofocus()" [attr.aria-label]="ariaLabel()" [attr.aria-labelledby]="ariaLabelledBy()" [attr.aria-invalid]="error() ? 'true' : null" [attr.tabindex]="tabindex()" (focus)="focus($event)" (input)="update($event)" (blur)="touch($event)">@if(showIcon()){<button type="button" aria-label="Open calendar" (click)="onShow.emit()">▣</button>}@if(showButtonBar()){<button type="button" (click)="today()">Today</button>@if(showClear()){<button type="button" (click)="clear()">Clear</button>}}</span>@if(error()){<span class="orc-date-picker__error" role="alert">{{error()}}</span>}@else if(helperText()){<span class="orc-date-picker__help">{{helperText()}}</span>}</label>
