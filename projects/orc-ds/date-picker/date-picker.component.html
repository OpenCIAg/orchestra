<label class="orc-date-picker"><span class="orc-date-picker__label">{{label()}} @if(required()){<span aria-hidden="true">*</span>}</span><input type="date" [value]="value()" [min]="min()" [max]="max()" [required]="required()" [disabled]="disabled() || cvaDisabled()" [attr.aria-invalid]="error() ? 'true' : null" (input)="update($event)" (blur)="touch()">@if(error()){<span class="orc-date-picker__error" role="alert">{{error()}}</span>}@else if(helperText()){<span class="orc-date-picker__help">{{helperText()}}</span>}</label>
