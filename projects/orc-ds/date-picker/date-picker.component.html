<label class="orc-date-picker"><span class="orc-date-picker__label">{{label()}} @if(required()){<span aria-hidden="true">*</span>}</span><span class="orc-date-picker__control"><input [id]="inputId()" [name]="name()" [type]="timeOnly() ? 'time' : (showTime() ? 'datetime-local' : 'date')" [value]="inputValue()" [min]="calendarMin() || ''" [max]="calendarMax() || ''" [placeholder]="placeholder()" [required]="required()" [disabled]="disabled() || cvaDisabled()" [readonly]="readonlyInput()" [autofocus]="autofocus()" [attr.aria-label]="ariaLabel()" [attr.aria-labelledby]="ariaLabelledBy()" [attr.aria-invalid]="error() ? 'true' : null" [attr.tabindex]="tabindex()" (focus)="focus($event)" (input)="update($event)" (keydown)="onInputKeydown($event)" (blur)="touch($event)">@if(showIcon()){<button type="button" aria-label="Open calendar" (click)="toggle()">▣</button>}@if(showButtonBar()){<button type="button" (click)="today()">Today</button>@if(showClear()){<button type="button" (click)="clear()">Clear</button>}}@if(showClear() && !showButtonBar()){<button type="button" aria-label="Clear" (click)="clear()">Clear</button>}</span>@if(overlayVisible() || inline()){<div class="orc-date-picker__panel" role="dialog">@for (offset of monthOffsets(); track offset) {<orc-date-picker-calendar [value]="calendarValue()" [selectedValues]="calendarValues()" [monthOffset]="offset" [firstDayOfWeek]="firstDayOfWeek()" [min]="calendarMin()" [max]="calendarMax()" [disabled]="disabled() || cvaDisabled()" [disabledDates]="disabledDates() || []" [disabledDays]="disabledDays() || []" [showWeek]="showWeek()" [showOtherMonths]="showOtherMonths()" [selectOtherMonths]="selectOtherMonths()" (dateSelected)="selectCalendarDate($event)" />}</div>}@if(error()){<span class="orc-date-picker__error" role="alert">{{error()}}</span>}@else if(helperText()){<span class="orc-date-picker__help" role="status">{{helperText()}}</span>}</label>
