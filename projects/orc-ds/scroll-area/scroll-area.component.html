<div
  class="orc-scroll-area"
  [class.orc-scroll-area--horizontal]="orientation() === 'horizontal'"
  [class.orc-scroll-area--both]="orientation() === 'both'"
  [class.orc-scroll-area--always]="alwaysShowScrollbar()"
>
  <div
    class="orc-scroll-area__shadow orc-scroll-area__shadow--top"
    [class.orc-scroll-area__shadow--visible]="canScrollUp()"
    aria-hidden="true"
  ></div>
  <div
    class="orc-scroll-area__shadow orc-scroll-area__shadow--bottom"
    [class.orc-scroll-area__shadow--visible]="canScrollDown()"
    aria-hidden="true"
  ></div>
  <div
    class="orc-scroll-area__shadow orc-scroll-area__shadow--left"
    [class.orc-scroll-area__shadow--visible]="canScrollLeft()"
    aria-hidden="true"
  ></div>
  <div
    class="orc-scroll-area__shadow orc-scroll-area__shadow--right"
    [class.orc-scroll-area__shadow--visible]="canScrollRight()"
    aria-hidden="true"
  ></div>
  <div
    #viewport
    class="orc-scroll-area__viewport"
    [style]="viewportStyle()"
    role="region"
    [attr.aria-label]="label() || 'Scrollable content'"
    tabindex="0"
    (scroll)="onScroll($event)"
  >
    <ng-content />
  </div>
</div>
