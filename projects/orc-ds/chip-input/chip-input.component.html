<div class="p-chips p-component orc-chip-input" [class]="'p-chips p-component orc-chip-input ' + styleClass()" [style]="style()" [attr.data-pc-name]="'chips'">
  <!-- Utilizamos o InputComponent estritamente como container -->
  <orc-input
    #orcInput
    [id]="inputId() || id()"
    [label]="label()"
    [helperText]="helperText()"
    [errorMessage]="errorMessage()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [size]="size()"
    [placeholder]="value().length > 0 ? '' : placeholder()"
    [status]="status()"
    [value]="inputValue()"
    [ariaLabel]="ariaLabel()"
    (inputChange)="onInputChange($event)"
    (keydown)="onKeydown($event)"
    (paste)="onPaste($event)"
    (blur)="onBlur()"
  >
    <!-- Slot de Prefixo: Renderiza as Tags internamente -->
    <div orcPrefix class="orc-chip-list" (click)="orcInput.focusNative()">
      @for (chip of value(); track $index) {
        <orc-badge
          variant="soft"
          status="primary"
          [pill]="false"
          [size]="size() === 'lg' ? 'md' : 'sm'"
          [dismissible]="!effectiveDisabled() && !readonly()"
          (dismiss)="removeChip($index)"
          class="orc-chip-item"
        >
          {{ chip }}
        </orc-badge>
      }
    </div>
  </orc-input>

  <!-- Autocomplete Dropdown / Sugestões -->
  @if (isSuggestionsVisible()) {
    <ul class="orc-chip-suggestions" role="listbox">
      @for (suggestion of filteredSuggestions(); track suggestion) {
        <li
          class="orc-chip-suggestion-item"
          role="option"
          (mousedown)="$event.preventDefault()" 
          (click)="selectSuggestion(suggestion)"
        >
          {{ suggestion }}
        </li>
      }
    </ul>
  }

  <!-- Região para Leitores de Tela (Acessibilidade) -->
  <div aria-live="polite" class="sr-only">
    {{ a11yMessage() }}
  </div>
</div>
