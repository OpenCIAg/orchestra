<div
  [id]="id() || null"
  class="p-accordion p-component orc-accordion"
  [class]="'p-accordion p-component orc-accordion ' + styleClass()"
  [class.orc-accordion--separated]="variant() === 'separated'"
  [class.orc-accordion--bordered]="variant() === 'bordered'"
  role="region"
  [attr.data-pc-name]="'accordion'"
  [attr.aria-label]="ariaLabel() || null"
>
  <ng-content></ng-content>
</div>
