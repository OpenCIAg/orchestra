<div
  [attr.id]="id() || null"
  class="p-accordion p-component orc-accordion"
  [ngClass]="styleClass()"
  [ngStyle]="style()"
  [style.--orc-accordion-transition]="transitionOptions() || null"
  [class.orc-accordion--separated]="variant() === 'separated'"
  [class.orc-accordion--bordered]="variant() === 'bordered'"
  role="region"
  [attr.data-pc-name]="'accordion'"
  [attr.aria-label]="ariaLabel() || null"
>
  <ng-content></ng-content>
</div>
