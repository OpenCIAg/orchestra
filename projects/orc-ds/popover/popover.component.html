<span class="orc-popover__trigger" role="button" tabindex="0" (click)="toggle()" (keydown.enter)="toggle()" (keydown.space)="toggle(); $event.preventDefault()" [attr.aria-expanded]="open()" [attr.aria-controls]="open() ? 'orc-popover-panel' : null"><ng-content select="[popover-trigger]" /></span>
@if (open()) { <section id="orc-popover-panel" class="orc-popover" [class]="'orc-popover orc-popover--'+placement()+' '+styleClass()" [style]="style()" role="dialog" [attr.aria-label]="ariaLabel() || label()" [attr.aria-labelledby]="ariaLabelledBy()" [attr.aria-live]="focusOnShow() ? 'polite' : null"><ng-content /></section> }
