<div class="orc-tree" role="tree" [attr.aria-label]="label()">@for(item of visibleNodes();track item.node.id){<div class="orc-tree__item" role="treeitem" tabindex="0" [style.--orc-tree-level]="item.level" [attr.aria-level]="item.level" [attr.aria-expanded]="item.expandable ? expanded().has(item.node.id) : null" [attr.aria-disabled]="item.node.disabled || null" (keydown)="keydown($event,item)" (click)="activate(item.node)">@if(item.expandable){<button type="button" class="orc-tree__toggle" (click)="toggle(item.node);$event.stopPropagation()" [attr.aria-label]="expanded().has(item.node.id) ? 'Recolher' : 'Expandir'">{{expanded().has(item.node.id)?'−':'+'}}</button>}@else{<span class="orc-tree__spacer"></span>}<span>{{item.node.label}}</span></div>}</div>
