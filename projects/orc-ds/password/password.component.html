<div
  [class]="
    'orc-p2-password ' +
    styleClass() +
    ' variant-' +
    variant() +
    (resolvedSize() === 'sm' ? ' size-small' : '') +
    (resolvedSize() === 'lg' ? ' size-large' : '')
  "
  [style]="style()"
  [class.fluid]="fluid()"
>
  <label *ngIf="label()" [attr.for]="effectiveInputId()">{{ label() }}</label>
  <div class="control">
    <input
      [attr.id]="effectiveInputId()"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      [autocomplete]="autocomplete()"
      [attr.maxlength]="maxLength()"
      [required]="required()"
      [disabled]="disabled() || cvaDisabled()"
      [readonly]="readonly()"
      [autofocus]="autofocus()"
      [attr.tabindex]="tabindex()"
      [class]="inputStyleClass()"
      [style]="inputStyle()"
      (input)="onInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-labelledby]="ariaLabelledBy() || null"
    />
    @if (showClear() && value() && clearAriaLabel()) {
      <button
        type="button"
        [disabled]="disabled() || cvaDisabled() || readonly()"
        (click)="clear()"
        [attr.aria-label]="clearAriaLabel()"
      >
        ×
      </button>
    }
    @if (toggleMask()) {
      <button
        type="button"
        [disabled]="disabled() || cvaDisabled()"
        (click)="toggleVisible()"
        [attr.aria-label]="
          visible()
            ? effectiveHidePasswordLabel()
            : effectiveShowPasswordLabel()
        "
      >
        {{ visible() ? '◉' : '○' }}
      </button>
    }
  </div>
  @if (
    feedback() &&
    (value() || focused()) &&
    (value() ? strengthLabel() : promptLabel())
  ) {
    <div class="feedback" aria-live="polite">
      <span>{{ value() ? strengthLabel() : promptLabel() }}</span
      ><span
        class="meter"
        [class.weak]="strength() === 'weak'"
        [class.medium]="strength() === 'medium'"
        [class.strong]="strength() === 'strong'"
      ></span>
    </div>
  }
</div>
