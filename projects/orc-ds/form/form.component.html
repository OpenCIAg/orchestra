<form
  #nativeForm
  class="orc-form"
  [class.orc-form--inline]="layout() === 'inline'"
  [class.orc-form--disabled]="disabled()"
  [attr.name]="name() || null"
  [attr.aria-label]="ariaLabel()?.trim() || 'Formulário'"
  novalidate
  (submit)="onSubmit($event)"
  (reset)="onReset()"
>
  <fieldset [disabled]="disabled()"><ng-content /></fieldset>
</form>
