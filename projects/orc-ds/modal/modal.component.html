<dialog
  #dialogRef
  [id]="id() || null"
  [class]="'p-dialog p-component ' + modalClasses() + ' ' + styleClass()"
  [style]="style()"
  [style.z-index]="inline() ? 'auto' : effectiveZIndex()"
  (cancel)="onCancel($event)"
  (click)="onBackdropClick($event)"
  [attr.role]="role()"
  aria-modal="true"
  [attr.aria-labelledby]="ariaLabelledBy() || null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-describedby]="ariaDescribedBy() || null"
  [attr.open]="inline() ? '' : null"
>
  <div class="orc-modal__container" (click)="$event.stopPropagation()">
    <!-- HEADER -->
    <header class="orc-modal__header" [class.orc-modal__header--hidden]="!showHeader()">
      <div class="orc-modal__header-content">
        @if (header()) { <span>{{ header() }}</span> }
        <ng-content select="[modal-header]"></ng-content>
      </div>
      
      @if (showCloseButton() && closable()) {
        <orc-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          (click)="onClose()"
          [ariaLabel]="closeAriaLabel()"
          class="orc-modal__close-btn"
        >
          <svg iconLeft viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </orc-button>
      }
      @if (maximizable()) { <button type="button" class="orc-modal__maximize" (click)="toggleMaximize()" [attr.aria-label]="maximized() ? 'Restore' : 'Maximize'">{{ maximized() ? minimizeIcon() : maximizeIcon() }}</button> }
    </header>

    <!-- BODY -->
    <main class="orc-modal__body" [class]="contentStyleClass()" [style]="contentStyle()">
      <ng-content select="[modal-body]"></ng-content>
    </main>

    <!-- FOOTER -->
    <footer class="orc-modal__footer">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </div>
</dialog>
