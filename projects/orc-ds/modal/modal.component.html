<dialog
  #dialogRef
  [attr.id]="id() || null"
  [class]="'p-dialog p-component ' + modalClassNames() + ' ' + styleClass()"
  [style]="style()"
  [style.z-index]="inline() ? 'auto' : effectiveZIndex()"
  (cancel)="onCancel($event)"
  (close)="onNativeClose()"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  [attr.role]="role()"
  [attr.aria-modal]="inline() || !modal() ? null : 'true'"
  [attr.aria-labelledby]="
    ariaLabelledBy() ||
    (!ariaLabel() && showHeader() && hasTitle() ? titleId : null)
  "
  [attr.aria-label]="
    ariaLabelledBy()
      ? null
      : ariaLabel() || (!showHeader() || !hasTitle() ? 'Dialog' : null)
  "
  [attr.aria-describedby]="ariaDescribedBy() || null"
>
  <div class="orc-modal__container">
    <!-- HEADER -->
    <header
      class="orc-modal__header"
      [class.orc-modal__header--hidden]="!showHeader()"
    >
      <div #headerContent [id]="titleId" class="orc-modal__header-content">
        @if (header()) {
          <span>{{ header() }}</span>
        }
        <ng-content select="[modal-header]"></ng-content>
      </div>

      @if (showCloseButton() && closable()) {
        <orc-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          [tabindex]="effectiveCloseTabindex()"
          (click)="onClose()"
          [ariaLabel]="closeAriaLabel() || 'Close dialog'"
          class="orc-modal__close-btn"
        >
          <span iconLeft class="orc-modal__close-icon" aria-hidden="true">
            {{ closeIcon() }}
          </span>
        </orc-button>
      }
      @if (maximizable()) {
        <button
          type="button"
          class="orc-modal__maximize"
          (click)="toggleMaximize()"
          [attr.aria-label]="
            maximized()
              ? restoreAriaLabel() || 'Restore dialog'
              : maximizeAriaLabel() || 'Maximize dialog'
          "
        >
          {{ maximized() ? minimizeIcon() : maximizeIcon() }}
        </button>
      }
    </header>

    <!-- BODY -->
    <div
      class="orc-modal__body"
      [class]="contentStyleClass()"
      [style]="contentStyle()"
    >
      <ng-content select="[modal-body]"></ng-content>
      <ng-content></ng-content>
    </div>

    <!-- FOOTER -->
    <footer class="orc-modal__footer">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </div>
</dialog>
