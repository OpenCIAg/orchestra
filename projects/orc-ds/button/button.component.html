<button
  [attr.id]="id() || null"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-disabled]="isDisabled() ? 'true' : null"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledBy() || null"
  [attr.aria-expanded]="ariaExpanded() ?? null"
  [attr.aria-controls]="ariaControls() || null"
  [attr.form]="form() || null"
  [attr.tabindex]="tabindex()"
  [attr.data-pc-name]="'button'"
  [class]="buttonClassString()"
  [style]="style()"
  (click)="handleClick($event)"
  (focus)="onFocus.emit($event)"
  (blur)="onBlur.emit($event)"
>
  @if (loading()) {
    <span class="orc-button__spinner" aria-hidden="true">
      @if (safeLoadingIcon(); as icon) {
        @if (icon.isSvg) {
          <span
            class="orc-button__loading-icon orc-button__icon-svg-wrapper"
            [innerHTML]="icon.content"
          ></span>
        } @else {
          <i [class]="'orc-button__loading-icon ' + icon.content"></i>
        }
      } @else {
        <svg class="orc-button__spinner-svg" viewBox="0 0 24 24" fill="none">
          <circle
            class="orc-button__spinner-track"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="3"
          ></circle>
          <circle
            class="orc-button__spinner-head"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="3"
            stroke-dasharray="80"
            stroke-dashoffset="60"
          ></circle>
        </svg>
      }
    </span>
  }

  <!-- Left Icon -->
  @if (safeIconLeft(); as icon) {
    <span class="orc-button__icon orc-button__icon--left" aria-hidden="true">
      @if (icon.isSvg) {
        <span
          class="orc-button__icon-svg-wrapper"
          [innerHTML]="icon.content"
        ></span>
      } @else {
        <i [class]="icon.content"></i>
      }
    </span>
  } @else {
    <span class="orc-button__icon orc-button__icon--left" aria-hidden="true"
      ><ng-content select="[iconLeft]"></ng-content
    ></span>
  }

  <!-- Content -->
  @if (variant() === 'close' && !safeIconLeft() && !safeIconRight()) {
    <span class="orc-button__icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="1em"
        height="1em"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </span>
  } @else {
    <span class="orc-button__text"><ng-content></ng-content></span>
  }
  @if (badge() !== undefined) {
    <span class="orc-button__badge {{ badgeClass() }}">{{ badge() }}</span>
  }

  <!-- Right Icon -->
  @if (safeIconRight(); as icon) {
    <span class="orc-button__icon orc-button__icon--right" aria-hidden="true">
      @if (icon.isSvg) {
        <span
          class="orc-button__icon-svg-wrapper"
          [innerHTML]="icon.content"
        ></span>
      } @else {
        <i [class]="icon.content"></i>
      }
    </span>
  } @else {
    <span class="orc-button__icon orc-button__icon--right" aria-hidden="true"
      ><ng-content select="[iconRight]"></ng-content
    ></span>
  }
</button>
