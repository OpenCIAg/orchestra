<figure
  [class]="'orc-image orc-image--' + radius() + ' ' + styleClass()"
  [style.width]="width() || null"
  [style.height]="height() || null"
>
  @if (renderedSrc()) {
    <img
      [src]="renderedSrc()"
      [attr.alt]="alt() || null"
      [loading]="loading()"
      [srcset]="srcSet() || null"
      [sizes]="sizes() || null"
      decoding="async"
      [class]="imageClass()"
      [style]="imageStyle()"
      [style.object-fit]="fit()"
      [attr.aria-label]="ariaLabel() || null"
      (load)="onLoad()"
      (error)="onError($event)"
      (click)="onImageClick()"
    />
  } @else if (placeholder()) {
    <div class="orc-image__placeholder" role="img" [attr.aria-label]="ariaLabel() || alt() || null">{{ placeholder() }}</div>
  }
  @if (previewVisible()) {
    <div class="orc-image__preview-mask" role="dialog" aria-modal="true" (click)="closePreview()">
      <div class="orc-image__preview-content" (click)="$event.stopPropagation()">
        <div class="orc-image__preview-toolbar" role="toolbar">
          <button type="button" [attr.aria-label]="zoomOutAriaLabel() || null" (click)="zoomOut()">−</button>
          <button type="button" [attr.aria-label]="zoomInAriaLabel() || null" (click)="zoomIn()">+</button>
          <button type="button" [attr.aria-label]="rotateLeftAriaLabel() || null" (click)="rotateLeft()">↶</button>
          <button type="button" [attr.aria-label]="rotateRightAriaLabel() || null" (click)="rotateRight()">↷</button>
          <button type="button" [attr.aria-label]="closePreviewAriaLabel() || null" (click)="closePreview()">×</button>
        </div>
        <img [src]="previewImageSrc() || renderedSrc()" [srcset]="previewImageSrcSet() || null" [sizes]="previewImageSizes() || null" [attr.alt]="alt() || null" [style.transform]="'scale(' + scale() + ') rotate(' + rotation() + 'deg)'" />
      </div>
    </div>
  }
</figure>
