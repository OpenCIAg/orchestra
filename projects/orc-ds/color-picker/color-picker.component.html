<div class="orc-color-picker" [class.orc-color-picker--disabled]="effectiveDisabled()">
  @if (label()) { <label class="orc-color-picker__label" [for]="effectiveId()">{{ label() }}</label> }
  <div class="orc-color-picker__control">
    <button type="button" class="orc-color-picker__trigger" [id]="effectiveId()" [disabled]="effectiveDisabled()" [attr.aria-label]="ariaLabel()" [attr.aria-expanded]="isOpen()" (click)="toggle()">
      <span class="orc-color-picker__swatch" [style.background-color]="value() || 'transparent'" aria-hidden="true"></span>
      @if (showInput()) { <span class="orc-color-picker__value">{{ value() || 'Sem cor' }}</span> }
      <span class="orc-color-picker__chevron" aria-hidden="true">⌄</span>
    </button>
    @if (clearable() && value()) { <button type="button" class="orc-color-picker__clear" (click)="clear()" [disabled]="effectiveDisabled()" aria-label="Remover cor">×</button> }
  </div>
  @if (isOpen() || inline()) {
    <div class="orc-color-picker__panel" [class]="panelStyleClass()" role="dialog" aria-label="Paleta de cores">
      <input class="orc-color-picker__native" type="color" [value]="nativeValue()" (input)="onNativeColor($event)" [disabled]="effectiveDisabled()" aria-label="Seletor nativo de cor" />
      @if (showInput()) { <input class="orc-color-picker__text" type="text" [value]="value()" (input)="onTextInput($event)" aria-label="Código hexadecimal" inputmode="text" /> }
      <div class="orc-color-picker__presets" aria-label="Cores predefinidas">
        @for (color of presets(); track color) { <button type="button" class="orc-color-picker__preset" [style.background-color]="color" [class.orc-color-picker__preset--active]="value().toUpperCase() === color.toUpperCase()" [attr.aria-label]="color" (click)="selectColor(color)"></button> }
      </div>
    </div>
  }
</div>
