<div class="p-inputnumber p-component orc-number-input" [class]="'p-inputnumber p-component orc-number-input ' + styleClass()" [style]="style()" [class.orc-number-input--disabled]="effectiveDisabled()" [class.orc-number-input--readonly]="readonly()" [class.orc-inputnumber-fluid]="fluid()" [attr.data-pc-name]="'inputnumber'">
  @if (label()) { <label class="orc-number-input__label" [for]="effectiveId()">{{ label() }} @if (required()) { <span aria-hidden="true">*</span> }</label> }
  <div class="orc-number-input__box" [class.orc-number-input__box--error]="status() === 'error' || !!errorMessage()" [class.orc-number-input__box--success]="status() === 'success'">
    @if (prefix()) { <span class="orc-number-input__affix">{{ prefix() }}</span> }
    @if (showControls() && showButtons()) { <button type="button" [class]="'p-inputnumber-button p-inputnumber-button-down orc-number-input__control ' + decrementButtonClass()" (click)="decrement()" [disabled]="effectiveDisabled() || readonly()" [attr.aria-label]="decrementButtonAriaLabel()">{{ decrementButtonIcon() }}</button> }
    <input #nativeInput [class]="'p-inputnumber-input orc-number-input__native ' + inputStyleClass()" [style]="inputStyle()" [id]="effectiveId()" [name]="name()" type="text" inputmode="decimal" role="spinbutton" [value]="displayValue()" [attr.placeholder]="placeholder() || null" [min]="min() ?? null" [max]="max() ?? null" [step]="step()" [disabled]="effectiveDisabled()" [readOnly]="readonly()" [required]="required()" [autofocus]="autofocus()" [attr.maxlength]="maxlength()" [attr.title]="title()" [attr.autocomplete]="autocomplete()" [attr.tabindex]="tabindex()" [attr.aria-label]="ariaLabel() || null" [attr.aria-labelledby]="ariaLabelledBy() || null" [attr.aria-required]="ariaRequired() ?? (required() ? 'true' : null)" [attr.aria-invalid]="status() === 'error' || errorMessage() ? 'true' : null" [attr.aria-describedby]="ariaDescribedBy() || describedBy()" [attr.aria-valuenow]="value()" [attr.aria-valuemin]="min()" [attr.aria-valuemax]="max()" (focus)="onFocus.emit($event)" (input)="handleInput($event)" (blur)="handleBlur($event)" (keydown)="onKeydown($event)" />
    @if (showClear() && value() !== null) { <button type="button" class="orc-number-input__control" (click)="clear()" [disabled]="effectiveDisabled() || readonly()" [attr.aria-label]="clearAriaLabel() || null">×</button> }
    @if (suffix()) { <span class="orc-number-input__affix">{{ suffix() }}</span> }
    @if (showControls() && showButtons()) { <button type="button" [class]="'p-inputnumber-button p-inputnumber-button-up orc-number-input__control ' + incrementButtonClass()" (click)="increment()" [disabled]="effectiveDisabled() || readonly()" [attr.aria-label]="incrementButtonAriaLabel()">{{ incrementButtonIcon() }}</button> }
  </div>
  @if (errorMessage() || helperText()) { <p class="orc-number-input__message" [class.orc-number-input__message--error]="!!errorMessage()" [id]="errorMessage() ? errorId() : helperId()">{{ errorMessage() || helperText() }}</p> }
</div>
