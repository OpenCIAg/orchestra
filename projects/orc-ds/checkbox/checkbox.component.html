<label
  class="orc-checkbox"
  [class.orc-checkbox--checked]="checked() && !indeterminate()"
  [class.orc-checkbox--indeterminate]="indeterminate()"
  [class.orc-checkbox--disabled]="isDisabled()"
  [class.orc-checkbox--error]="isError()"
  [attr.for]="effectiveId()"
>
  <!-- Visually hidden native checkbox input for complete a11y, keyboard navigation (Space key) and Form bindings -->
  <input
    #nativeInput
    type="checkbox"
    class="orc-checkbox__native-input"
    [id]="effectiveId()"
    [name]="name() || null"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    [attr.aria-describedby]="computedAriaDescribedBy()"
    [attr.aria-checked]="ariaChecked()"
    [attr.aria-invalid]="isError()"
    (change)="onNativeChange($event)"
    (blur)="onBlur()"
  />

  <!-- Visual Custom Checkbox matching Figma 382:5024 (16x16px, 4px border radius) -->
  <span class="orc-checkbox__box" aria-hidden="true">
    <!-- Checked Checkmark Icon -->
    <svg
      *ngIf="checked() && !indeterminate()"
      class="orc-checkbox__icon orc-checkbox__icon--check"
      viewBox="0 0 16 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3.5 8.2L6.5 11.2L12.5 4.8"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <!-- Indeterminate Dash Icon -->
    <svg
      *ngIf="indeterminate()"
      class="orc-checkbox__icon orc-checkbox__icon--dash"
      viewBox="0 0 16 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3.5 8H12.5"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </span>

  <!-- Label, Description / Error & Content Projection -->
  <span class="orc-checkbox__content" *ngIf="hasContent()">
    <span class="orc-checkbox__label" [id]="labelId()" *ngIf="label()">{{ label() }}</span>
    <ng-content></ng-content>
    <span class="orc-checkbox__description" [id]="descriptionId()" *ngIf="description() && !errorMessage()">
      {{ description() }}
    </span>
    <span class="orc-checkbox__error" [id]="errorId()" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </span>
  </span>

  <span class="orc-checkbox__content" *ngIf="!hasContent()">
    <ng-content></ng-content>
  </span>
</label>
