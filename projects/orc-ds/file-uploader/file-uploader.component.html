<div class="orc-file-uploader" [class.orc-file-uploader--disabled]="isDisabled()">
  
  <input 
    #fileInput
    type="file" 
    class="orc-file-uploader__input" 
    [accept]="accept()" 
    [multiple]="multiple()"
    [disabled]="isDisabled() || hasReachedMaxFiles()"
    (change)="onFileSelected($event)"
    hidden
    aria-hidden="true"
  />

  <div 
    class="orc-file-uploader__dropzone"
    [class.orc-file-uploader__dropzone--dragover]="isDragging() || forceDragover()"
    [class.orc-file-uploader__dropzone--disabled]="isDisabled()"
    role="button"
    tabindex="0"
    (click)="onAreaClick()"
    (keydown)="onAreaKeyDown($event)"
    [attr.aria-disabled]="isDisabled() || hasReachedMaxFiles()"
    aria-label="Área de upload de arquivos"
  >
    <div class="orc-file-uploader__dropzone-content">
      <div class="orc-file-uploader__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div class="orc-file-uploader__text">
        <span class="orc-file-uploader__label">{{ label() }}</span>
        @if (subLabel()) {
          <span class="orc-file-uploader__sublabel">{{ subLabel() }}</span>
        }
      </div>
    </div>
  </div>

  @if (files().length > 0) {
    <div class="orc-file-uploader__list" aria-live="polite">
      @for (file of files(); track file.id) {
        <orc-file-item 
          [fileData]="file" 
          [disabled]="isDisabled()"
          (remove)="onRemoveFile($event)">
        </orc-file-item>
      }
    </div>
  }
</div>
