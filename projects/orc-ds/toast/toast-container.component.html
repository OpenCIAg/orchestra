@for (pos of positions; track pos) {
  @if (toastsByPosition()[pos].length > 0) {
    <div
      class="p-toast p-component orc-toast-stack"
      [class]="'orc-toast-stack--' + pos"
      role="region"
      [attr.aria-label]="ariaLabel() || null"
      aria-live="polite"
    >
      @for (item of toastsByPosition()[pos]; track item.id) {
        <orc-toast
          [toast]="item"
          (dismiss)="handleDismiss($event)"
        />
      }
    </div>
  }
}
