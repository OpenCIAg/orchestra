<!-- Item com RouterLink do Angular -->
<a
  *ngIf="routerLink() && !active() && !disabled()"
  [routerLink]="routerLink()"
  class="orc-breadcrumb-item__link"
  (click)="handleClick($event)"
>
  <span *ngIf="icon()" class="orc-breadcrumb-item__icon" aria-hidden="true">
    <svg *ngIf="icon() === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </span>
  <span class="orc-breadcrumb-item__label" *ngIf="label()">{{ label() }}</span>
  <ng-content></ng-content>
</a>

<!-- Item com link HTML nativo (href) -->
<a
  *ngIf="href() && !routerLink() && !active() && !disabled()"
  [href]="href()"
  class="orc-breadcrumb-item__link"
  (click)="handleClick($event)"
>
  <span *ngIf="icon()" class="orc-breadcrumb-item__icon" aria-hidden="true">
    <svg *ngIf="icon() === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </span>
  <span class="orc-breadcrumb-item__label" *ngIf="label()">{{ label() }}</span>
  <ng-content></ng-content>
</a>

<!-- Item ativo / página atual (WAI-ARIA aria-current="page") -->
<span
  *ngIf="active()"
  class="orc-breadcrumb-item__current"
  aria-current="page"
>
  <span *ngIf="icon()" class="orc-breadcrumb-item__icon" aria-hidden="true">
    <svg *ngIf="icon() === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </span>
  <span class="orc-breadcrumb-item__label" *ngIf="label()">{{ label() }}</span>
  <ng-content></ng-content>
</span>

<!-- Item navegável genérico (sem routerLink ou href) ou desabilitado -->
<span
  *ngIf="!active() && !routerLink() && !href()"
  [class.orc-breadcrumb-item__link]="!disabled()"
  [class.orc-breadcrumb-item__text]="disabled()"
  [class.orc-breadcrumb-item__text--disabled]="disabled()"
  [attr.role]="!disabled() ? 'button' : null"
  [attr.tabindex]="!disabled() ? 0 : null"
  (click)="handleClick($event)"
  (keydown.enter)="handleClick($any($event))"
  (keydown.space)="handleClick($any($event))"
>
  <span *ngIf="icon()" class="orc-breadcrumb-item__icon" aria-hidden="true">
    <svg *ngIf="icon() === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </span>
  <span class="orc-breadcrumb-item__label" *ngIf="label()">{{ label() }}</span>
  <ng-content></ng-content>
</span>
