<div
  [attr.id]="id() || null"
  class="p-chip p-component orc-chip"
  [class]="
    'p-chip p-component orc-chip orc-chip--' +
    variant() +
    ' orc-chip--' +
    size() +
    ' ' +
    styleClass()
  "
  [style]="style()"
  [class.orc-chip--selected]="selected()"
  [class.orc-chip--disabled]="disabled()"
  [attr.data-pc-name]="'chip'"
  role="group"
  [attr.aria-label]="ariaLabel() || label() || 'Chip'"
  [attr.aria-disabled]="disabled() ? 'true' : null"
>
  @if (selectable()) {
    <button
      type="button"
      class="orc-chip__main"
      [disabled]="disabled()"
      [attr.aria-label]="ariaLabel() || label() || 'Toggle selection'"
      [attr.aria-pressed]="selected()"
      (click)="toggle()"
    >
      @if (image()) {
        <img [src]="image()" alt="" />
      } @else if (icon()) {
        <span aria-hidden="true">{{ icon() }}</span>
      }
      {{ label() }}
    </button>
  } @else {
    <span class="orc-chip__main">
      @if (image()) {
        <img [src]="image()" alt="" />
      } @else if (icon()) {
        <span aria-hidden="true">{{ icon() }}</span>
      }
      {{ label() }}</span
    >
  }
  @if (removable()) {
    <button
      type="button"
      class="orc-chip__remove"
      [disabled]="disabled()"
      (click)="remove($event)"
      [attr.aria-label]="removeButtonLabel()"
    >
      {{ removeIcon() }}
    </button>
  }
</div>
