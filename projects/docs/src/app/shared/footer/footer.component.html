<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <img src="favicon.ico" alt="Orchestra" width="18" height="18" />
      <span class="footer__brand-name">Orchestra Design System</span>
    </div>

    <div class="footer__sep" aria-hidden="true"></div>

    <nav class="footer__links" aria-label="Links do footer">
      <a
        href="https://angular.dev"
        target="_blank"
        rel="noopener noreferrer"
        class="footer__link"
        >Angular {{ angularMajor }}</a
      >
      <span aria-hidden="true">·</span>
      <a
        href="https://angular.dev/guide/signals"
        target="_blank"
        rel="noopener noreferrer"
        class="footer__link"
        >Signals</a
      >
      <span aria-hidden="true">·</span>
      <span class="footer__link footer__link--plain">Semântica e teclado</span>
    </nav>

    <div class="footer__sep" aria-hidden="true"></div>

    <span class="footer__credit">
      Uma ideia
      <button
        type="button"
        class="footer__animation-trigger"
        aria-label="Ativar animação Orchestra (três cliques)"
        (click)="triggerEasterEgg()"
      >
        <img
          src="/assets/ciag-white.svg"
          alt="CIAg"
          class="footer__ciag-logo"
        />
      </button>
    </span>
  </div>
</footer>
