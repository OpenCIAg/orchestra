<button
  class="theme-toggle"
  type="button"
  [attr.aria-pressed]="themeService.theme() === 'dark'"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
  [attr.title]="themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
  (click)="themeService.toggle()"
>
  @if (themeService.theme() === 'dark') {
    <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
    </svg>
    <span>Claro</span>
  } @else {
    <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
    </svg>
    <span>Escuro</span>
  }
</button>
