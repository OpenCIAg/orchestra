<div class="layout-wrapper" [class.layout-wrapper--collapsed]="isSidebarCollapsed()">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-logo">
        <span class="brand-logo__circle"></span>
        <span class="brand-logo__text" *ngIf="!isSidebarCollapsed()">Orchestra</span>
      </div>
      <orc-icon-button
        variant="ghost"
        size="sm"
        [ariaLabel]="'Recolher barra lateral'"
        (click)="toggleSidebar()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </orc-icon-button>
    </div>

    <nav class="sidebar__nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [orcTooltip]="isSidebarCollapsed() ? 'Dashboard' : ''"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span class="nav-item__text" *ngIf="!isSidebarCollapsed()">Dashboard</span>
      </a>

      <a
        routerLink="/crud"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [orcTooltip]="isSidebarCollapsed() ? 'Gerenciador CRUD' : ''"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="nav-item__text" *ngIf="!isSidebarCollapsed()">Gerenciador CRUD</span>
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [orcTooltip]="isSidebarCollapsed() ? 'Configurações & Wizard' : ''"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="nav-item__text" *ngIf="!isSidebarCollapsed()">Configurações & Wizard</span>
      </a>

      <a
        routerLink="/login"
        class="nav-item"
        [orcTooltip]="isSidebarCollapsed() ? 'Tela de Login' : ''"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span class="nav-item__text" *ngIf="!isSidebarCollapsed()">Tela de Login</span>
      </a>
    </nav>

    <div class="sidebar__footer" *ngIf="!isSidebarCollapsed()">
      <orc-badge status="success" [dot]="true">v0.1.0 Framework</orc-badge>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar__left">
        <orc-breadcrumb>
          <orc-breadcrumb-item label="Orchestra" [active]="false"></orc-breadcrumb-item>
          <orc-breadcrumb-item label="Enterprise Template" [active]="true"></orc-breadcrumb-item>
        </orc-breadcrumb>
      </div>

      <div class="topbar__right">
        <orc-icon-button
          variant="ghost"
          size="sm"
          [ariaLabel]="'Alternar tema claro/escuro'"
          (click)="toggleTheme()"
          [orcTooltip]="isDarkMode() ? 'Mudar para Tema Claro' : 'Mudar para Tema Escuro'"
        >
          <svg *ngIf="!isDarkMode()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg *ngIf="isDarkMode()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </orc-icon-button>

        <div class="user-profile-trigger">
          <orc-dropdown [items]="userMenuItems" placement="bottom-end">
            <div class="user-pill">
              <orc-avatar
                name="Admin CIAG"
                size="sm"
                status="online"
              ></orc-avatar>
              <span class="user-pill__name">Admin CIAG</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="user-pill__chevron">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </orc-dropdown>
        </div>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
