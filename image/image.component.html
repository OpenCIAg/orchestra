<figure
  [class]="'orc-image orc-image--' + radius() + ' ' + styleClass()"
  [style.width]="width() || null"
  [style.height]="height() || null"
>
  @if (renderedSrc()) {
    <button
      type="button"
      class="orc-image__trigger"
      [disabled]="!preview()"
      [attr.aria-label]="
        preview()
          ? ariaLabel() ||
            (alt() ? 'Open image preview: ' + alt() : 'Open image preview')
          : null
      "
      (click)="onImageClick()"
      (keydown)="onTriggerKeydown($event)"
    >
      <img
        [src]="renderedSrc()"
        [attr.alt]="alt() || null"
        [loading]="loading()"
        [srcset]="srcSet() || null"
        [sizes]="sizes() || null"
        decoding="async"
        [class]="imageClass()"
        [style]="imageStyle()"
        [style.object-fit]="fit()"
        [attr.aria-label]="ariaLabel() || null"
        (load)="onLoad()"
        (error)="onError($event)"
      />
    </button>
  } @else if (placeholder()) {
    <div
      class="orc-image__placeholder"
      role="img"
      [attr.aria-label]="ariaLabel() || alt() || null"
    >
      {{ placeholder() }}
    </div>
  }
  @if (previewVisible()) {
    <orc-modal
      [isOpen]="previewVisible()"
      [showHeader]="false"
      [showCloseButton]="false"
      [closable]="false"
      [ariaLabel]="ariaLabel() || 'Image preview'"
      [transitionOptions]="showTransitionOptions()"
      [styleClass]="'orc-image__preview-modal'"
      [contentStyleClass]="'orc-image__preview-modal-body'"
      (closed)="onPreviewModalClosed()"
    >
      <div modal-body class="orc-image__preview-content">
        <div
          class="orc-image__preview-toolbar"
          role="toolbar"
          [attr.aria-label]="'Image preview controls'"
        >
          <button
            type="button"
            [attr.aria-label]="zoomOutAriaLabel() || 'Zoom out'"
            (click)="zoomOut()"
          >
            −
          </button>
          <button
            type="button"
            [attr.aria-label]="zoomInAriaLabel() || 'Zoom in'"
            (click)="zoomIn()"
          >
            +
          </button>
          <button
            type="button"
            [attr.aria-label]="rotateLeftAriaLabel() || 'Rotate left'"
            (click)="rotateLeft()"
          >
            ↶
          </button>
          <button
            type="button"
            [attr.aria-label]="rotateRightAriaLabel() || 'Rotate right'"
            (click)="rotateRight()"
          >
            ↷
          </button>
          <button
            type="button"
            [attr.aria-label]="closePreviewAriaLabel() || 'Close image preview'"
            (click)="closePreview()"
          >
            ×
          </button>
        </div>
        <img
          [src]="previewImageSrc() || renderedSrc()"
          [srcset]="previewImageSrcSet() || null"
          [sizes]="previewImageSizes() || null"
          [attr.alt]="alt() || null"
          [style.transform]="
            'scale(' + scale() + ') rotate(' + rotation() + 'deg)'
          "
        />
      </div>
    </orc-modal>
  }
</figure>
